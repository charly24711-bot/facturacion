name: CI POS Supermercado - Batería Integral

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-windows:
    name: Test Windows (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Ejecutar Suites Pytest (Fases 1, 2, 3 y Flujo E2E)
        run: |
          python -m pytest test_fase1_pos_ergonomia.py test_fase2_backoffice.py test_fase3_gondola_seguridad.py test_flujo_completo_pos.py -v --tb=short

      - name: 📑 Ejecutar Pruebas Fiscales y RUC (DNIT / SIFEN)
        run: |
          python test_cobro_ruc_ticket.py
          python test_ruc_integration.py
          python test_flujo_presupuesto.py

      - name: 🏢 Ejecutar Pruebas de Panel Administrativo y Autenticación
        run: |
          python test_auth_admin.py
          python test_riguroso_panel_admin.py
          python test_e2e_flujo.py

      - name: ⚡ Ejecutar Batería de Stress Integral 360°
        run: |
          python test_stress_integral_360.py

  test-ubuntu:
    name: Test Linux Headless (Python 3.12)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🐧 Instalar librerías del sistema para PyQt6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 xvfb

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: 📦 Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Ejecutar Suites Pytest con xvfb
        run: |
          xvfb-run -a python -m pytest test_fase1_pos_ergonomia.py test_fase2_backoffice.py test_fase3_gondola_seguridad.py test_flujo_completo_pos.py -v --tb=short

      - name: 📑 Ejecutar Pruebas Fiscales y RUC
        run: |
          xvfb-run -a python test_cobro_ruc_ticket.py
          xvfb-run -a python test_ruc_integration.py
          xvfb-run -a python test_flujo_presupuesto.py

      - name: ⚡ Ejecutar Batería de Stress 360
        run: |
          xvfb-run -a python test_stress_integral_360.py
